<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>My Business</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}body{background:#f0f2f5;padding:15px}.card{background:white;max-width:480px;margin:0 auto;border-radius:16px;padding:22px;box-shadow:0 4px 20px rgba(0,0,0,.08)}.header{text-align:center;margin-bottom:20px}.header h1{color:#0d5a3a;font-size:26px}.header p{color:#666;font-size:14px}input{width:100%;padding:14px;border:1.5px solid #ddd;border-radius:10px;margin-bottom:12px;font-size:16px;outline:none}input:focus{border-color:#00c853}.btn{width:100%;padding:15px;background:#00c853;color:white;border:none;border-radius:10px;font-size:17px;font-weight:bold;cursor:pointer;margin-bottom:10px}.btn-wa{background:#25D366}.profit-box{background:#e8f5e9;color:#0d5a3a;padding:12px;border-radius:10px;font-weight:bold;font-size:18px;margin:15px 0;display:none}.receipt{border:2px dashed #333;padding:18px;border-radius:10px;background:#fffef7;display:none;margin-top:10px}</style></head><body><div class="card"><div class="header"><h1>My Business</h1><p>Naija Seller Assistant</p></div><input id="product" placeholder="Product Name e.g Shoe"><input id="cost" type="number" placeholder="Cost Price e.g 5000"><input id="price" type="number" placeholder="Selling Price e.g 8000"><input id="customer" placeholder="Customer Name e.g Mama Tobi"><button class="btn" onclick="calc()">Calculate Profit & Create Receipt</button><div id="profit" class="profit-box"></div><div id="receipt" class="receipt"></div><button id="waBtn" class="btn btn-wa" style="display:none" onclick="shareWA()">Share on WhatsApp</button></div><script>let lastText="";function calc(){const p=document.getElementById('product').value||"Product";const c=Number(document.getElementById('cost').value)||0;const pr=Number(document.getElementById('price').value)||0;const cu=document.getElementById('customer').value||"Customer";if(!c||!pr){alert("Put Cost and Price");return;}const pf=pr-c;const now=new Date();const d=now.toLocaleDateString('en-NG')+" "+now.toLocaleTimeString('en-NG');document.getElementById('profit').style.display="block";document.getElementById('profit').innerHTML="Profit: N"+pf.toLocaleString();document.getElementById('receipt').innerHTML="<h3 style='text-align:center'>RECEIPT</h3><p><b>MY BUSINESS</b></p><hr><p><b>Date:</b> "+d+"</p><p><b>Customer:</b> "+cu+"</p><p><b>Product:</b> "+p+"</p><p><b>Price:</b> N"+pr.toLocaleString()+"</p><p><b>Profit:</b> N"+pf.toLocaleString()+"</p><hr><p style='text-align:center'>Thanks!</p>";document.getElementById('receipt').style.display="block";document.getElementById('waBtn').style.display="block";lastText="*MY BUSINESS - RECEIPT*%0ADate: "+d+"%0ACustomer: "+cu+"%0AProduct: "+p+"%0APrice: N"+pr.toLocaleString()+"%0AThanks!";}function shareWA(){window.open("https://wa.me/?text="+lastText,"_blank");}</script></body></html>
