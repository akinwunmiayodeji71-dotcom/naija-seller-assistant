<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Naija Seller Assistant</title>
<style>
body{font-family:Arial;background:#f5f5f5;margin:0;padding:15px}
.card{background:white;padding:15px;border-radius:12px;margin-bottom:15px;box-shadow:0 2px 5px rgba(0,0,0,0.1)}
input{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}
button{width:100%;padding:14px;background:#25D366;color:white;border:none;border-radius:8px;font-weight:bold;font-size:16px}
.profit{color:green;font-weight:bold;font-size:18px}
.receipt{background:#fff;border:2px dashed #333;padding:15px;margin-top:15px;white-space:pre-line}
h2{color:#075E54;margin-top:0}
</style>
</head>
<body>
<div class="card">
<h2>Naija Seller Assistant</h2>
<input id="pName" placeholder="Product Name e.g. Shoe">
<input id="cost" type="number" placeholder="Cost Price e.g. 5000">
<input id="sell" type="number" placeholder="Selling Price e.g. 8000">
<input id="customer" placeholder="Customer Name e.g. Mama Tobi">
<button onclick="generate()">Calculate Profit & Create Receipt</button>
<div id="result"></div>
</div>
<script>
function generate(){
 let name=document.getElementById('pName').value;
 let cost=parseInt(document.getElementById('cost').value)||0;
 let sell=parseInt(document.getElementById('sell').value)||0;
 let cust=document.getElementById('customer').value;
 let profit=sell-cost;
 let receipt = `RECEIPT\nCustomer: ${cust}\nProduct: ${name}\nPrice: N${sell}\nProfit: N${profit}\nThanks for patronage!`;
 document.getElementById('result').innerHTML = `<p class="profit">Profit: N${profit}</p><div class="receipt">${receipt}</div><br><button onclick="shareReceipt()">Share on WhatsApp</button>`;
 window.lastReceipt=receipt;
}
function shareReceipt(){
 let text=encodeURIComponent(window.lastReceipt);
 window.open(`https://wa.me/?text=${text}`,'_blank');
}
</script>
</body>
</html>
