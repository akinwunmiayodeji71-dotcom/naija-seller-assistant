<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Seller Assistant</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}body{background:#f0f2f5;padding:12px}.card{background:#fff;max-width:480px;margin:0 auto;border-radius:16px;padding:20px;box-shadow:0 4px 20px rgba(0,0,0,.08)}.h{text-align:center;margin-bottom:18px}.h h1{color:#0d5a3a;font-size:24px}.h p{color:#777;font-size:13px}input{width:100%;padding:13px;border:1.5px solid #ddd;border-radius:10px;margin-bottom:10px;font-size:15px;outline:none}input:focus{border-color:#00c853}.btn{width:100%;padding:14px;background:#00c853;color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:bold;cursor:pointer;margin-top:8px}.btn-wa{background:#25D366}.profit{background:#e8f5e9;color:#0d5a3a;padding:12px;border-radius:10px;font-weight:bold;text-align:center;margin:12px 0;display:none}#receiptWrap{display:none;margin-top:14px;text-align:center}canvas{max-width:100%;border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.1)}</style></head><body><div class="card"><div class="h"><h1>My Business</h1><p>Receipt Maker for Sellers</p></div><input id="biz" placeholder="Your Business Name e.g Deji Stores"><input id="product" placeholder="Product Name e.g Shoe"><input id="cost" type="number" placeholder="Cost Price e.g 5000"><input id="price" type="number" placeholder="Selling Price e.g 8000"><input id="customer" placeholder="Customer Name e.g Tobi"><button class="btn" onclick="make()">Calculate Profit & Create Image Receipt</button><div id="profit" class="profit"></div><div id="receiptWrap"><canvas id="canvas" width="600" height="700"></canvas><br><button class="btn" onclick="downloadImg()">Download Receipt Image</button><button class="btn btn-wa" onclick="shareImg()">Share Image on WhatsApp</button><p style="font-size:12px;color:#666;margin-top:8px">After download, go to WhatsApp and send the image to customer</p></div></div><script>function make(){const biz=document.getElementById('biz').value||"MY BUSINESS";const prod=document.getElementById('product').value||"Product";const cost=Number(document.getElementById('cost').value)||0;const price=Number(document.getElementById('price').value)||0;const cust=document.getElementById('customer').value||"Customer";if(!cost||!price){alert("Put Cost and Selling Price");return;}const profit=price-cost;const d=new Date();const dateStr=d.toLocaleDateString('en-NG')+" "+d.toLocaleTimeString('en-NG');document.getElementById('profit').style.display="block";document.getElementById('profit').innerText="YOUR PROFIT: ₦"+profit.toLocaleString()+" (Customer won't see this)";const c=document.getElementById('canvas');const ctx=c.getContext('2d');ctx.fillStyle="#fffef7";ctx.fillRect(0,0,600,700);ctx.fillStyle="#000";ctx.font="bold 28px monospace";ctx.textAlign="center";ctx.fillText("RECEIPT",300,50);ctx.font="bold 22px sans-serif";ctx.fillText(biz.toUpperCase(),300,85);ctx.strokeStyle="#000";ctx.beginPath();ctx.moveTo(40,100);ctx.lineTo(560,100);ctx.stroke();ctx.textAlign="left";ctx.font="18px monospace";ctx.fillText("Date: "+dateStr,40,135);ctx.fillText("Customer: "+cust,40,165);ctx.fillText("Product: "+prod,40,195);ctx.font="bold 20px monospace";ctx.fillText("Price: ₦"+price.toLocaleString(),40,240);ctx.font="16px sans-serif";ctx.strokeStyle="#000";ctx.beginPath();ctx.moveTo(40,260);ctx.lineTo(560,260);ctx.stroke();ctx.textAlign="center";ctx.font="18px sans-serif";ctx.fillText("Thank you for your patronage!",300,295);ctx.font="13px sans-serif";ctx.fillText(biz+" | "+dateStr,300,330);document.getElementById('receiptWrap').style.display="block";}function downloadImg(){const c=document.getElementById('canvas');const a=document.createElement('a');a.download="receipt-"+Date.now()+".png";a.href=c.toDataURL();a.click();}function shareImg(){alert("1. Click Download Receipt Image first\n2. Go to WhatsApp\n3. Send the image to your customer\n(Image receipt is more professional!)");downloadImg();}</script></body></html>
