<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Seller Assistant</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}body{background:#f0f2f5;padding:12px}.card{background:#fff;max-width:480px;margin:0 auto;border-radius:16px;padding:20px;box-shadow:0 4px 20px rgba(0,0,0,.08)}.h{text-align:center;margin-bottom:18px}.h h1{color:#0d5a3a;font-size:24px}.h p{color:#777;font-size:13px}input{width:100%;padding:13px;border:1.5px solid #ddd;border-radius:10px;margin-bottom:10px;font-size:15px}input:focus{border-color:#00c853;outline:none}.btn{width:100%;padding:14px;background:#00c853;color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:bold;cursor:pointer;margin-top:8px}.profit{background:#e8f5e9;color:#0d5a3a;padding:12px;border-radius:10px;font-weight:bold;text-align:center;margin:12px 0;display:none}#receiptWrap{display:none;margin-top:14px;text-align:center}canvas{max-width:100%;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.15)}</style></head><body><div class="card"><div class="h"><h1>My Business</h1><p>Beautiful Receipt Maker</p></div><input id="biz" placeholder="Business Name e.g Tee Collection"><input id="product" placeholder="Product e.g Luxury Ankara Dress"><input id="cost" type="number" placeholder="Cost Price e.g 15000"><input id="price" type="number" placeholder="Selling Price e.g 25000"><input id="customer" placeholder="Customer Name e.g Ms. Chioma"><button class="btn" onclick="make()">Create Beautiful Receipt ✨</button><div id="profit" class="profit"></div><div id="receiptWrap"><canvas id="canvas" width="700" height="850"></canvas><br><button class="btn" onclick="downloadImg()">Download Beautiful Receipt</button><p style="font-size:11px;color:#888;margin-top:6px">Customers will love to share this receipt!</p></div></div><script>function make(){const biz=(document.getElementById('biz').value||"TEE COLLECTION").toUpperCase();const prod=document.getElementById('product').value||"Shoe";const cost=Number(document.getElementById('cost').value)||0;const price=Number(document.getElementById('price').value)||0;const cust=document.getElementById('customer').value||"Customer";if(!price){alert("Put price");return;}const profit=price-cost;const d=new Date();const dateStr=d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})+" • "+d.toLocaleTimeString('en-NG',{hour:'2-digit',minute:'2-digit'})+" WAT";const rno="TEE-"+Math.floor(100000+Math.random()*900000);document.getElementById('profit').style.display="block";document.getElementById('profit').innerText="YOUR PRIVATE PROFIT: NGN "+profit.toLocaleString();const c=document.getElementById('canvas');const ctx=c.getContext('2d');ctx.fillStyle="#fdfcf7";ctx.fillRect(0,0,700,850);ctx.strokeStyle="#1a5c2e";ctx.lineWidth=3;ctx.setLineDash([8,6]);ctx.strokeRect(15,15,670,820);ctx.setLineDash([]);ctx.lineWidth=1;ctx.fillStyle="#1a5c2e";ctx.font="bold 48px serif";ctx.textAlign="center";ctx.fillText("♻",350,85);ctx.font="bold 34px serif";ctx.fillText(biz,350,125);ctx.font="12px sans-serif";ctx.fillStyle="#1a5c2e";ctx.fillText("PREMIUM FASHION • LAGOS, NIGERIA",350,145);ctx.fillStyle="#1a5c2e";ctx.fillRect(100,165,500,1);ctx.fillStyle="#0d3d1f";ctx.font="bold 52px sans-serif";ctx.fillText("RECEIPT",350,215);ctx.font="16px sans-serif";ctx.fillStyle="#1a5c2e";ctx.fillText("Thank you for shopping with us!",350,240);ctx.textAlign="left";ctx.fillStyle="#1a5c2e";ctx.font="bold 14px sans-serif";ctx.fillText("RECEIPT NO:",40,295);ctx.fillStyle="#000";ctx.font="bold 18px sans-serif";ctx.fillText("#"+rno,40,318);ctx.fillStyle="#1a5c2e";ctx.font="bold 14px sans-serif";ctx.fillText("DATE & TIME:",40,350);ctx.fillStyle="#000";ctx.font="bold 18px sans-serif";ctx.fillText(dateStr,40,373);ctx.fillStyle="#1a5c2e";ctx.font="bold 14px sans-serif";ctx.fillText("CUSTOMER:",40,405);ctx.fillStyle="#000";ctx.font="18px sans-serif";ctx.fillText(cust,40,428);ctx.setLineDash([6,6]);ctx.strokeStyle="#1a5c2e";ctx.beginPath();ctx.moveTo(40,445);ctx.lineTo(660,445);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle="#1a5c2e";ctx.font="bold 18px sans-serif";ctx.fillText("ITEM DETAILS",60,475);ctx.fillStyle="#000";ctx.font="bold 20px sans-serif";ctx.fillText(prod,40,510);ctx.font="13px sans-serif";ctx.fillStyle="#444";ctx.fillText("Qty: 1",40,530);ctx.textAlign="right";ctx.fillStyle="#000";ctx.font="bold 22px sans-serif";ctx.fillText("NGN "+price.toLocaleString()+".00",660,520);ctx.textAlign="left";ctx.setLineDash([6,6]);ctx.beginPath();ctx.moveTo(40,555);ctx.lineTo(660,555);ctx.stroke();ctx.setLineDash([]);ctx.font="18px sans-serif";ctx.fillStyle="#000";ctx.fillText("Subtotal:",40,590);ctx.textAlign="right";ctx.fillText("NGN "+price.toLocaleString()+".00",660,590);ctx.textAlign="left";ctx.fillStyle="#1a5c2e";ctx.fillRect(40,610,660-40,2);ctx.fillStyle="#fff";ctx.fillRect(40,620,200,38);ctx.fillStyle="#1a5c2e";ctx.fillRect(40,620,200,38);ctx.fillStyle="#fff";ctx.font="bold 20px sans-serif";ctx.textAlign="center";ctx.fillText("TOTAL PAID:",140,645);ctx.textAlign="right";ctx.fillStyle="#1a5c2e";ctx.font="bold 36px sans-serif";ctx.fillText("NGN "+price.toLocaleString()+".00",660,650);ctx.textAlign="center";ctx.fillStyle="#1a5c2e";ctx.fillRect(40,680,620,60);ctx.fillStyle="#fff";ctx.font="bold 24px sans-serif";ctx.fillText("THANK YOU!",350,705);ctx.font="13px sans-serif";ctx.fillText("We truly appreciate your support. Wear it with style!",350,725);ctx.fillStyle="#1a5c2e";ctx.font="bold 14px sans-serif";ctx.fillText("FOLLOW & CONNECT",350,770);ctx.font="12px sans-serif";ctx.fillText("@teecollection_ng | +234 801 234 5678 | Lekki, Lagos",350,790);ctx.font="10px sans-serif";ctx.fillStyle="#666";ctx.fillText("Receipt generated via Naija Seller Assistant • "+dateStr,350,820);document.getElementById('receiptWrap').style.display="block";}function downloadImg(){const c=document.getElementById('canvas');const a=document.createElement('a');a.download="beautiful-receipt-"+Date.now()+".png";a.href=c.toDataURL();a.click();}</script></body></html>
